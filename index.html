  <!-- =====================================================
       EMERGENCY ERROR CAPTURE
       ===================================================== -->

  <script>
    (() => {

      window.__CAP_EMERGENCY_LOGS__ = [];

      function record(
        type,
        source,
        message,
        details = ""
      ) {

        window.__CAP_EMERGENCY_LOGS__.push({
          time:
            new Date().toISOString(),

          type,
          source,

          message:
            String(message),

          details:
            String(details || "")
        });

      }


      /* -----------------------------------------------
         RUNTIME ERRORS
         ----------------------------------------------- */

      window.addEventListener(
        "error",
        (event) => {

          record(
            "ERROR",
            event.filename ||
              "WINDOW",
            event.message ||
              "Unknown JavaScript error.",
            event.error?.stack ||
              `Location: ${
                event.filename ||
                "unknown"
              }:${
                event.lineno || 0
              }:${
                event.colno || 0
              }`
          );

        },
        true
      );


      /* -----------------------------------------------
         UNHANDLED PROMISE REJECTIONS
         ----------------------------------------------- */

      window.addEventListener(
        "unhandledrejection",
        (event) => {

          record(
            "ERROR",
            "UNHANDLED PROMISE",
            event.reason?.message ||
              String(
                event.reason ||
                "Unknown Promise rejection."
              ),
            event.reason?.stack ||
              ""
          );

        },
        true
      );


      /* -----------------------------------------------
         MODULE / SCRIPT LOAD FAILURES
         ----------------------------------------------- */

      window.addEventListener(
        "error",
        (event) => {

          const target =
            event.target;

          if (
            target &&
            (
              target.tagName ===
                "SCRIPT" ||
              target.tagName ===
                "LINK"
            )
          ) {

            const source =
              target.src ||
              target.href ||
              "Unknown resource";

            record(
              "ERROR",
              "RESOURCE LOAD",
              `Failed to load resource: ${source}`,
              ""
            );

          }

        },
        true
      );


      /* -----------------------------------------------
         CONSOLE MIRROR
         ----------------------------------------------- */

      const originalConsoleError =
        console.error;

      console.error =
        (...args) => {

          record(
            "ERROR",
            "console.error",
            args
              .map(
                value => {
                  try {
                    return typeof value ===
                      "object"
                      ? JSON.stringify(
                          value,
                          null,
                          2
                        )
                      : String(value);
                  } catch {
                    return String(value);
                  }
                }
              )
              .join(" ")
          );

          originalConsoleError.apply(
            console,
            args
          );
        };


      /*
       * Marker so we know the emergency layer itself
       * loaded before application modules.
       */
      record(
        "INFO",
        "EMERGENCY BOOT",
        "Emergency error capture initialized."
      );

    })();
  </script>

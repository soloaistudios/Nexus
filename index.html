  <!-- =====================================================
       EMERGENCY DEBUG BOOT
       ===================================================== -->

  <script>
    (() => {

      const emergencyLogs = [];

      function safeString(value) {
        try {
          return String(value);
        } catch {
          return "Unknown error";
        }
      }

      function addEmergencyLog(
        level,
        source,
        message,
        details = ""
      ) {
        emergencyLogs.push({
          time:
            new Date().toISOString(),

          level,
          source,
          message:
            safeString(message),

          details:
            safeString(details),
        });

        renderEmergencyPanel();
      }

      function renderEmergencyPanel() {

        let root =
          document.getElementById(
            "cap-emergency-debug"
          );

        if (!root) {
          root =
            document.createElement(
              "div"
            );

          root.id =
            "cap-emergency-debug";

          root.style.cssText = `
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 2147483647;
            width: min(760px, calc(100vw - 24px));
            max-height: 75vh;
            overflow: auto;
            padding: 14px;
            background: #07101d;
            color: #ffffff;
            border: 1px solid #ff5252;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,.55);
            font-family: system-ui, sans-serif;
            font-size: 12px;
          `;

          document.body.appendChild(
            root
          );
        }

        const errorCount =
          emergencyLogs.filter(
            item =>
              item.level ===
              "ERROR"
          ).length;

        root.innerHTML = `
          <div
            style="
              display:flex;
              align-items:center;
              justify-content:space-between;
              gap:10px;
              margin-bottom:10px;
            "
          >
            <strong
              style="
                font-size:13px;
                letter-spacing:.08em;
              "
            >
              CAP EMERGENCY DEBUG
            </strong>

            <span
              style="
                color:${
                  errorCount
                    ? "#ff5252"
                    : "#32d583"
                };
                font-weight:800;
              "
            >
              ${
                errorCount
              } error${
                errorCount === 1
                  ? ""
                  : "s"
              }
            </span>
          </div>

          <div
            style="
              margin-bottom:10px;
              color:#9ba9ba;
            "
          >
            This fallback console is active before
            the main application starts.
          </div>

          <div
            id="cap-emergency-log"
          ></div>

          <div
            style="
              display:flex;
              gap:8px;
              margin-top:12px;
              flex-wrap:wrap;
            "
          >

            <button
              id="cap-emergency-copy"
              style="
                border:1px solid #304861;
                background:#102238;
                color:#fff;
                padding:8px 12px;
                border-radius:8px;
                cursor:pointer;
                font-weight:700;
              "
            >
              Copy Bug Report
            </button>

            <button
              id="cap-emergency-hide"
              style="
                border:1px solid #304861;
                background:#102238;
                color:#fff;
                padding:8px 12px;
                border-radius:8px;
                cursor:pointer;
                font-weight:700;
              "
            >
              Hide
            </button>

          </div>
        `;

        const logContainer =
          document.getElementById(
            "cap-emergency-log"
          );

        if (!logContainer) {
          return;
        }

        for (
          const entry
          of emergencyLogs
        ) {

          const row =
            document.createElement(
              "div"
            );

          row.style.cssText = `
            margin-bottom:8px;
            padding:9px;
            border-radius:8px;
            background:${
              entry.level === "ERROR"
                ? "rgba(255,82,82,.08)"
                : "rgba(255,255,255,.03)"
            };
            border:1px solid ${
              entry.level === "ERROR"
                ? "rgba(255,82,82,.22)"
                : "rgba(255,255,255,.06)"
            };
          `;

          row.innerHTML = `
            <div
              style="
                display:flex;
                gap:8px;
                flex-wrap:wrap;
                margin-bottom:5px;
              "
            >
              <strong>
                ${escapeHTML(
                  entry.level
                )}
              </strong>

              <span
                style="
                  color:#4da3ff;
                  font-weight:700;
                "
              >
                ${escapeHTML(
                  entry.source
                )}
              </span>

              <span
                style="
                  color:#7f8b9b;
                "
              >
                ${escapeHTML(
                  entry.time
                )}
              </span>
            </div>

            <div>
              ${escapeHTML(
                entry.message
              )}
            </div>

            ${
              entry.details
                ? `
                  <pre
                    style="
                      margin:8px 0 0;
                      white-space:pre-wrap;
                      word-break:break-word;
                      color:#b7c0cc;
                      font-size:10px;
                    "
                  >${escapeHTML(
                    entry.details
                  )}</pre>
                `
                : ""
            }
          `;

          logContainer.appendChild(
            row
          );
        }

        document
          .getElementById(
            "cap-emergency-copy"
          )
          ?.addEventListener(
            "click",
            async () => {

              const report =
                buildEmergencyReport();

              try {

                await navigator
                  .clipboard
                  .writeText(
                    report
                  );

                const button =
                  document.getElementById(
                    "cap-emergency-copy"
                  );

                if (button) {
                  button.textContent =
                    "Copied ✓";

                  setTimeout(
                    () => {
                      button.textContent =
                        "Copy Bug Report";
                    },
                    1500
                  );
                }

              } catch {

                window.prompt(
                  "Copy CAP Bug Report",
                  report
                );

              }

            }
          );

        document
          .getElementById(
            "cap-emergency-hide"
          )
          ?.addEventListener(
            "click",
            () => {

              const panel =
                document.getElementById(
                  "cap-emergency-debug"
                );

              if (panel) {
                panel.remove();
              }

            }
          );
      }

      function buildEmergencyReport() {

        return [
          "=================================================",
          "CAP MARKETPLACE EMERGENCY BUG REPORT",
          "=================================================",
          "",
          `Generated: ${new Date().toISOString()}`,
          `Page: ${location.href}`,
          `User Agent: ${navigator.userAgent}`,
          `Online: ${navigator.onLine}`,
          "",
          "-------------------------------------------------",
          "LOG",
          "-------------------------------------------------",
          "",
          ...emergencyLogs.map(
            (entry, index) => [
              `[${index + 1}]`,
              `Time: ${entry.time}`,
              `Level: ${entry.level}`,
              `Source: ${entry.source}`,
              `Message: ${entry.message}`,
              entry.details
                ? `Details:\n${entry.details}`
                : "",
              "",
            ].join("\n")
          ),
          "-------------------------------------------------",
          "END REPORT",
          "-------------------------------------------------",
        ].join("\n");
      }

      function escapeHTML(value) {
        return safeString(value)
          .replaceAll(
            "&",
            "&amp;"
          )
          .replaceAll(
            "<",
            "&lt;"
          )
          .replaceAll(
            ">",
            "&gt;"
          )
          .replaceAll(
            '"',
            "&quot;"
          )
          .replaceAll(
            "'",
            "&#039;"
          );
      }

      /* -----------------------------------------------
         GLOBAL ERROR
         ----------------------------------------------- */

      window.addEventListener(
        "error",
        event => {

          addEmergencyLog(
            "ERROR",
            event.filename ||
              "WINDOW",
            event.message ||
              "Unknown JavaScript error.",
            event.error?.stack ||
              `Location: ${
                event.filename ||
                "unknown"
              }:${event.lineno || 0}:${
                event.colno || 0
              }`
          );

          renderEmergencyPanel();
        }
      );


      /* -----------------------------------------------
         UNHANDLED PROMISE
         ----------------------------------------------- */

      window.addEventListener(
        "unhandledrejection",
        event => {

          addEmergencyLog(
            "ERROR",
            "UNHANDLED PROMISE",
            event.reason?.message ||
              String(
                event.reason ||
                "Unknown Promise rejection."
              ),
            event.reason?.stack ||
              ""
          );

          renderEmergencyPanel();
        }
      );


      /*
       * Give the emergency console a small startup
       * marker so we know this layer itself loaded.
       */
      addEmergencyLog(
        "INFO",
        "EMERGENCY BOOT",
        "Emergency debug monitor loaded."
      );

    })();
  </script>


  <!-- =====================================================
       MAIN DEBUG MODULE
